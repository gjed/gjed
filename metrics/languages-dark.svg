<svg xmlns="http://www.w3.org/2000/svg" width="800" height="224" viewBox="0 0 800 224" role="img" aria-labelledby="title desc">
  <title id="title">Most used languages</title>
  <desc id="desc">Go 48.1%, Python 23.7%, HTML 11.1%, HCL 5.5%, CSS 2.9%, TypeScript 2.5%, Other 6.2%</desc>
  <style>
    .t { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .d { font-family: Newsreader, 'Source Serif 4', Georgia, 'Times New Roman', serif; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <text class="d" x="1" y="28" font-size="24" font-weight="500" fill="#ECE6DA">Most used languages</text>
  <text class="t" x="800" y="28" font-size="13" text-anchor="end" fill="#A3ADB5">by code size across 16 public repositories</text>
