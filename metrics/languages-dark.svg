  <text class="d" x="1" y="28" font-size="24" font-weight="500" fill="#ECE6DA">Most used languages</text>
  <text class="t" x="800" y="28" font-size="13" text-anchor="end" fill="#A3ADB5">by code size across 12 public repositories</text>
