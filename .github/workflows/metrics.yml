name: "Metrics"

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/notable-historical.mjs"
  pull_request:
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/notable-historical.mjs"
  schedule:
    - cron: "55 05 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  metrics:
    name: "Generate and publish metrics"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: "Generate app token"
        id: "app-token"
        if: "github.ref == 'refs/heads/main'"
        uses: "actions/create-github-app-token@v3"
        with:
          app-id: "${{ secrets.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
      - name: "Checkout"
        uses: "actions/checkout@v6"
        with:
          token: "${{ steps.app-token.outputs.token || github.token }}"
      - name: "Setup Node"
        uses: "actions/setup-node@v7"
        with:
          node-version: "24"
      - name: "Generate notable contributions and recent pull requests"
        run: "node .github/scripts/notable-historical.mjs"
        env:
          GITHUB_TOKEN: "${{ secrets.METRICS_TOKEN }}"
          GITHUB_LOGIN: "${{ github.repository_owner }}"
      - name: "Publish"
        if: "github.ref == 'refs/heads/main'"
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain=v1 ./metrics/ README.md)" ]; then
            git add ./metrics/ README.md
            git commit -m "[skip ci] Metrics $(date -Iseconds)"
            git push
          fi
